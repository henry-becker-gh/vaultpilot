[package]
name = "vaultpilot"
version = "0.1.0"
edition = "2021"
description = "VaultPilot - the autonomous earnings treasury for AI agents: deposits are auto-split by an on-chain policy into operating/reserve/treasury shares"
license = "MIT"
repository = "https://github.com/henry-becker-gh/vaultpilot"

[lib]
crate-type = ["cdylib", "lib"]
name = "vaultpilot"

[dependencies]
solana-program = "1"
# Pinned below 1.8: blake3 >=1.8 pulls digest 0.11 -> ctutils -> cmov 0.5.x,
# whose manifests require Cargo edition2024 (rustc >= 1.85) which the Agave
# v2.1.x platform-tools (cargo 1.79) cannot parse. Direct pin unifies the
# version for the whole graph.
blake3 = "=1.5.5"
borsh = { version = "=1.5.7", features = ["derive"] }

[dev-dependencies]
solana-sdk = "1"
